<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0909">
<title>Один вечер в истории</title>
<link rel="stylesheet" href="fonts.css">
<script src="telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<style>
/* Замысел: игра на время против друга. Руки заняты: лампа, порошок, сундук.
   Открытый вопрос задан в первые 10 секунд, оплата стоит на ткани в сундуке. */
:root{
  color-scheme:dark;
  --black:#0b0909; --white:#fbf6ee; --dim:rgba(251,246,238,.68);
  --glass:rgba(24,19,18,.52); --edge:rgba(251,246,238,.2);
  --paper:#e9e0cc; --ink:#191412; --stamp:#b5272f; --alarm:#ff5a4d;
  --t:#e7b98f;
  --poster:"Sofia Sans Extra Condensed","Arial Narrow",Impact,sans-serif;
  --text:"Onest","Segoe UI",system-ui,sans-serif;
  --period:"Old Standard TT",Georgia,serif;
  --pad-l:max(20px,env(safe-area-inset-left,0px));
  --pad-r:max(20px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--black);color:var(--white);font-family:var(--text);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
#bd{position:fixed;inset:-60px;background:center/cover no-repeat;filter:blur(40px) brightness(.34) saturate(1.1)}
#app{position:relative;height:100%;width:min(100%,calc(100vh * .58));margin:0 auto;overflow:hidden;background:var(--black);container-type:size;cursor:pointer}
#app.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateY(5px)}50%{transform:translateY(-3px)}80%{transform:translateY(1px)}}

/* Кадр */
#layers,.layer,.layer img,.blk{position:absolute;inset:0}
.layer{overflow:hidden;will-change:clip-path,opacity}
.layer img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%);will-change:transform}
.layer.fade{animation:fade 1s ease both}
.layer.drift img{animation:drift 22s linear both}
.layer.night img{filter:brightness(.42) saturate(.8)}
.layer.real img{animation:develop 2.4s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drift{from{transform:scale(1.13) translate(var(--dx,0),var(--dy,0))}to{transform:scale(1.02)}}
@keyframes develop{from{transform:scale(1.12);filter:brightness(2.1) contrast(.7)}to{transform:scale(1);filter:none}}
.blk{background:var(--black);animation:fade .4s both}
#shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,rgba(9,7,7,.92) 0,rgba(9,7,7,.62) 24%,rgba(9,7,7,0) 54%),linear-gradient(to bottom,rgba(9,7,7,.66),rgba(9,7,7,0) 16%)}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.11;mix-blend-mode:overlay;animation:grain .5s steps(5) infinite;z-index:8}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-40px,30px)}40%{transform:translate(30px,-50px)}60%{transform:translate(-60px,-20px)}80%{transform:translate(50px,40px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#flash.go{animation:flash .75s ease-out}
@keyframes flash{0%{opacity:.96}100%{opacity:0}}

/* Верх: часы против друга */
#top{position:absolute;z-index:6;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad-r) 0 var(--pad-l);display:flex;flex-direction:column;gap:7px;transition:opacity .5s;pointer-events:none}
#top.off{opacity:0}
#top button{pointer-events:auto}
#pct{height:2.5px;background:rgba(251,246,238,.24);overflow:hidden}
#pct i{display:block;height:100%;background:var(--white);transform:scaleX(var(--p,0));transform-origin:left;transition:transform .8s ease}
.row{display:flex;align-items:center;gap:12px;height:34px}
#clock{font:800 31px/1 var(--poster);font-variant-numeric:tabular-nums;letter-spacing:.01em;position:relative;transition:color .3s}
#clock.hit{color:var(--alarm)}
#clock .plus{position:absolute;left:100%;top:1px;margin-left:8px;color:var(--alarm);white-space:nowrap;animation:plus 1.6s ease-out both}
@keyframes plus{from{opacity:0;transform:translateY(8px)}15%{opacity:1;transform:none}80%{opacity:1}to{opacity:0;transform:translateY(-8px)}}
#rival{flex:1;min-width:0;text-align:right;font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rival b{font-weight:600;color:var(--white);font-variant-numeric:tabular-nums}
#snd{height:30px;display:flex;align-items:center;color:var(--white)}
#snd:not(.on) .w{display:none}
#when{font-size:12.5px;color:var(--dim);min-height:15px}
#when b{font-weight:500;color:var(--white)}

/* Субтитры */
#cap{position:absolute;z-index:5;left:var(--pad-l);right:var(--pad-r);bottom:calc(66px + env(safe-area-inset-bottom,0px));font-size:clamp(23px,6.9cqw,29px);font-weight:500;line-height:1.2;letter-spacing:-.012em;text-wrap:balance;pointer-events:none;text-shadow:0 1px 22px rgba(0,0,0,.7)}
#cap span.w{display:inline-block;animation:word .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 40ms)}
#cap.now span.w{animation:none}
#cap em{font-style:normal;color:var(--t)}
#cap.out{opacity:0;transform:translateY(-8px);transition:.2s}
@keyframes word{from{opacity:0;transform:translateY(.42em);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#tap{position:absolute;z-index:5;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;opacity:0;transition:opacity .4s;pointer-events:none}
#tap.on{opacity:1}
#tap i{display:block;width:36px;height:3px;background:var(--white);opacity:.75;animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleX(.45);opacity:.3}}

/* Вопросы и панель */
#panel{position:absolute;z-index:8;left:0;right:0;bottom:0;padding:0 var(--pad-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--pad-l);display:flex;flex-direction:column;gap:9px;cursor:default}
.q{font:800 clamp(52px,17.5cqw,74px)/.9 var(--poster);text-transform:uppercase;letter-spacing:-.004em;margin:0 0 10px;text-wrap:balance}
.line{display:block;overflow:hidden;padding-top:.03em}
.line>span{display:block;animation:rise .85s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 75ms)}
@keyframes rise{from{transform:translateY(106%)}to{transform:none}}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:18.5px;font-weight:500;line-height:1.2;animation:optin .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.25s + var(--i,0) * 80ms);transition:background .25s,color .25s,transform .25s,opacity .3s}
@keyframes optin{from{opacity:0;transform:translateY(14px)}}
@media (hover:hover){.opt:hover{background:rgba(251,246,238,.16)}.main:hover{background:#fff}.card.pick:hover img{filter:grayscale(.3)}}
.opt.chosen{background:var(--white);color:var(--ink);transform:scale(1.015)}
.opt.gone{opacity:0;transform:translateY(8px)}
.main{display:block;width:100%;padding:17px 18px;background:var(--white);color:var(--ink);font-size:18.5px;font-weight:600;text-align:center;transition:transform .2s,background .2s;animation:optin .6s .3s cubic-bezier(.2,.8,.2,1) both}
.main:active{transform:scale(.98)}
.main.pay{background:var(--stamp);color:#fff;font-size:20px;padding:19px 18px;animation:optin .6s .3s both,payglow 1.7s 1s ease-in-out infinite}
@keyframes payglow{50%{box-shadow:0 0 0 7px rgba(181,39,47,.3)}}
.star{width:1.12em;height:1.12em;margin-left:.24em;vertical-align:-.2em;fill:#ffc53d;stroke:#ffc53d;stroke-width:2.2;stroke-linejoin:round}
.quiet{display:block;width:100%;padding:9px;color:var(--dim);font-size:15px;line-height:1.3;text-align:center}
.quiet.fine{padding:0 9px 4px;font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
#name{width:100%;font:800 46px/1.05 var(--poster);text-transform:uppercase;color:var(--white);background:none;border:0;border-bottom:2px solid var(--white);padding:2px 0 7px;margin-bottom:8px;border-radius:0;user-select:text;-webkit-user-select:text}
#name::placeholder{color:rgba(251,246,238,.38)}
#name:focus{outline:none}

/* Руки: крюки, лампа, порошок */
#hot{position:absolute;inset:0;z-index:4}
#hot svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hot line{stroke:var(--white);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .75s cubic-bezier(.76,0,.2,1)}
#hot line.on{stroke-dashoffset:0}
.spot{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;display:grid;place-items:center}
.spot::before{content:"";width:14px;height:14px;border-radius:50%;background:rgba(251,246,238,.92);box-shadow:0 0 0 0 rgba(251,246,238,.55);animation:ring 2.1s infinite}
.spot.done::before{width:7px;height:7px;animation:none;background:var(--t)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(251,246,238,.55)}75%,100%{box-shadow:0 0 0 22px rgba(251,246,238,0)}}
.lamp,.scrub{position:absolute;inset:0;touch-action:none;cursor:none;background:var(--black)}
.lamp img,.scrub img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.lamp .dk{filter:brightness(.09) saturate(.6)}
.lamp .lit{-webkit-mask-image:radial-gradient(circle 118px at var(--x,50%) var(--y,44%),#000 34%,transparent 100%);mask-image:radial-gradient(circle 118px at var(--x,50%) var(--y,44%),#000 34%,transparent 100%)}
.lamp .glow{position:absolute;left:var(--x,50%);top:var(--y,44%);width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,120,.2),transparent 62%);mix-blend-mode:screen;pointer-events:none}
.lamp .ping{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2px solid var(--white);animation:ping .8s ease-out both;pointer-events:none}
@keyframes ping{to{transform:scale(6);opacity:0}}
.scrub canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .7s}
.scrub.done canvas{opacity:0}

/* Обратный отсчёт */
#cd{position:absolute;z-index:6;left:0;right:0;top:calc(84px + env(safe-area-inset-top,0px));text-align:center;font:800 clamp(82px,27cqw,118px)/1 var(--poster);font-variant-numeric:tabular-nums;pointer-events:none;text-shadow:0 3px 30px rgba(0,0,0,.75)}
#cd.alarm{color:var(--alarm);animation:beat .9s infinite}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(1)}42%{transform:scale(1.04)}}

/* Доска */
#board{position:absolute;inset:0;z-index:6;background:rgba(9,7,7,.74);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:calc(98px + env(safe-area-inset-top,0px)) var(--pad-r) calc(16px + env(safe-area-inset-bottom,0px)) var(--pad-l);display:flex;flex-direction:column;gap:12px;animation:fade .4s both;cursor:default}
#board .q{font-size:clamp(42px,13.8cqw,60px);margin:0}
#board.look{cursor:pointer}
#board.wait .card{pointer-events:none}
#hot.wait .spot{pointer-events:none;opacity:.3}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 1 auto;min-height:0}
.card{position:relative;aspect-ratio:1/1.13;overflow:hidden;background:#1a1516;text-align:left;display:block;width:100%;animation:deal .6s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i) * 90ms + .1s)}
@keyframes deal{from{opacity:0;transform:translateY(18px) rotate(calc(var(--i) * 1.6deg - 2.4deg)) scale(.94)}}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 18%);filter:grayscale(1) contrast(1.08);transition:filter .4s}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(9,7,7,.95) 8%,rgba(9,7,7,0) 56%)}
.card .who{position:absolute;z-index:1;left:10px;right:8px;bottom:8px}
.card b{display:block;font:800 29px/.95 var(--poster);text-transform:uppercase}
.card small{display:block;font-size:12.5px;line-height:1.18;color:var(--dim);margin-top:3px}
.card .unk{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:24%;font:800 104px/1 var(--poster);color:rgba(251,246,238,.2)}
.card.pick{outline:1px solid var(--edge);outline-offset:-1px}
.card.out{cursor:default}
.card.out img{filter:grayscale(1) brightness(.34)}
.card .no{position:absolute;z-index:2;left:50%;top:40%;padding:5px 11px 6px;border:3px solid var(--stamp);color:#ff6a60;background:rgba(9,7,7,.5);font:800 27px/1 var(--poster);text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%) rotate(-9deg);animation:slam .36s cubic-bezier(.3,1.7,.5,1) both}
@keyframes slam{from{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.3)}}
#board .say{font-size:17.5px;font-weight:500;line-height:1.22;min-height:22px}
#board .say em{font-style:normal;color:var(--t)}

/* Глава */
#card{position:absolute;inset:0;z-index:7;pointer-events:none}
#card u{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--white);animation:dot .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i) * 80ms)}
@keyframes dot{from{transform:scale(0)}}
#card .tt{position:absolute;left:0;right:0;text-align:center;font:800 clamp(56px,19cqw,82px)/.9 var(--poster);text-transform:uppercase;padding:0 12px;text-wrap:balance}
#card .n{display:block;font:500 14px/1 var(--text);letter-spacing:.02em;text-transform:none;color:var(--dim);margin-bottom:9px;animation:fade .6s both}

/* Газета */
#news{position:absolute;inset:0;z-index:7;pointer-events:none;display:grid;place-items:center;padding:0 var(--pad-r) 30px var(--pad-l)}
#news::before{content:"";position:absolute;inset:0;background:rgba(9,7,7,.62);animation:fade .5s both}
.paper{position:relative;width:100%;max-width:400px;background:var(--paper);color:var(--ink);padding:14px 15px 15px;box-shadow:0 26px 60px rgba(0,0,0,.65);animation:spin .95s cubic-bezier(.13,.72,.22,1) both;transform:rotate(-2.2deg)}
.paper.bye{animation:bye .32s ease-in both}
@keyframes spin{from{opacity:.2;transform:rotate(-1100deg) scale(.03)}85%{transform:rotate(-1deg) scale(1.03)}to{transform:rotate(-2.2deg) scale(1)}}
@keyframes bye{to{opacity:0;transform:rotate(9deg) translateY(-120%)}}
.mast{font:700 clamp(27px,8.6cqw,36px)/1 var(--period);text-align:center;white-space:nowrap}
.dl{display:flex;justify-content:space-between;font:400 13px/1 var(--period);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);padding:4px 0 3px;margin:7px 0 11px}
.paper h3{font:800 clamp(39px,12.8cqw,54px)/.93 var(--poster);text-transform:uppercase;text-align:center;margin:0 0 11px;text-wrap:balance}
.ht{height:125px;overflow:hidden;background:#cdbfa5}
.ht img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.35);mix-blend-mode:multiply}
.score{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.score div{text-align:center;padding:8px 3px 9px;min-width:0}
.score div+div{border-left:1px solid var(--ink)}
.score span{display:block;font:400 13.5px/1.1 var(--period)}
.score b{display:block;font:800 31px/1 var(--poster);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.stamp{position:absolute;right:11px;bottom:-15px;padding:6px 11px 7px;border:3px solid var(--stamp);color:var(--stamp);background:rgba(233,224,204,.92);font:800 22px/1 var(--poster);text-transform:uppercase;letter-spacing:.03em;transform:rotate(-6deg);animation:stamp .4s 1.05s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:rotate(-6deg) scale(2.1)}}
#news.final{place-items:start center;padding-top:calc(66px + env(safe-area-inset-top,0px))}
#news.final::before{background:rgba(9,7,7,.74)}

/* Оплата */
.nearly{font-size:15px;color:var(--dim);display:flex;justify-content:space-between;gap:12px;animation:fade .6s both}
.nearly b{font-weight:600;color:var(--white)}

/* Лист */
#sheet{position:absolute;inset:0;z-index:12;background:rgba(9,7,7,.6);display:flex;align-items:flex-end;animation:fade .25s both;cursor:default}
#sheet .in{width:100%;max-height:78%;overflow:auto;background:var(--paper);color:var(--ink);padding:20px var(--pad-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--pad-l);animation:up .4s cubic-bezier(.16,1,.3,1) both;user-select:text;-webkit-user-select:text}
@keyframes up{from{transform:translateY(100%)}}
#sheet h4{font:800 38px/.95 var(--poster);text-transform:uppercase;margin:0 0 11px}
#sheet p{font:400 18px/1.32 var(--period);margin:0 0 9px}
#sheet p a{display:inline-block;padding:3px 0}
#sheet button{width:100%;padding:14px;margin-top:8px;background:var(--ink);color:var(--paper);font-weight:600}

/* Обложка */
#cover{position:absolute;z-index:6;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--pad-r) calc(20px + env(safe-area-inset-bottom,0px)) var(--pad-l);gap:12px;cursor:default;transition:opacity .45s}
#cover.out{opacity:0;pointer-events:none}
#cover .brand{position:absolute;left:var(--pad-l);top:calc(17px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.pegs{width:15px;height:19px;position:relative;display:block;flex:none}
.pegs u{position:absolute;width:3.5px;height:3.5px;border-radius:50%;background:currentColor}
.pegs u:nth-child(1){left:0;top:0}.pegs u:nth-child(2){right:0;top:0}.pegs u:nth-child(3){left:0;bottom:0}.pegs u:nth-child(4){right:0;bottom:0}
#cover h1{font:800 clamp(60px,23.4cqw,106px)/.86 var(--poster);text-transform:uppercase;letter-spacing:-.008em;margin:0;white-space:nowrap}
#cover p{margin:0;font-size:clamp(18px,5.3cqw,22px);line-height:1.22;font-weight:500;text-wrap:balance}
.dare{align-self:flex-start;display:flex;flex-direction:column;gap:2px;padding:9px 13px 10px;background:var(--paper);color:var(--ink);transform:rotate(-1.4deg);box-shadow:0 12px 30px rgba(0,0,0,.5);animation:optin .7s .5s both}
.dare b{font:800 25px/1 var(--poster);text-transform:uppercase}
.dare small{font-size:12px;color:#6d6155}
.glint{position:absolute;z-index:5;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:#fff;box-shadow:0 0 16px 5px rgba(255,255,255,.65);opacity:0;animation:glint 5.2s infinite;animation-delay:calc(var(--i) * 1.3s + 1s);pointer-events:none}
@keyframes glint{0%,14%,100%{opacity:0}6%{opacity:.95}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="bd"></div>
<div id="app">
  <div id="layers"></div>
  <div id="shade"></div>
  <div id="hot" hidden></div>
  <div id="grain"></div>
  <div id="top" class="off">
    <div id="pct"><i></i></div>
    <div class="row">
      <span id="clock">00:00</span>
      <span id="rival"></span>
      <button id="snd" type="button" aria-label="Звук" aria-pressed="false"><svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 6.5v5h3.2L10 15.5v-13L5.2 6.5H2Z" fill="currentColor" stroke="none"/><path class="w" d="M13 6a4.4 4.4 0 0 1 0 6M15.5 3.5a8 8 0 0 1 0 11"/></svg></button>
    </div>
    <div id="when"></div>
  </div>
  <div id="cap" aria-live="polite"></div>
  <div id="tap"><i></i></div>
  <div id="stageui"></div>
  <div id="flash"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,60):ms));
const app=$('app'),layers=$('layers'),cap=$('cap'),ui=$('stageui'),hotEl=$('hot');

/* Голос. Длительность берём из файла, поэтому история не ждёт звука, если он заблокирован */
const VO={bytes:{},buf:{},ready:Promise.resolve(),cur:null};
fetch('vo.json').then(r=>r.json()).then(m=>{VO.map=m;const q=[...new Set(Object.values(m))];const pull=async()=>{while(q.length){const n=q.shift();try{VO.bytes[n]=await (await fetch(`vo/${n}.mp3`)).arrayBuffer();voOne(n)}catch(_){}}};for(let i=0;i<6;i++)pull()}).catch(()=>{});
function voOne(n){if(!ac||!VO.bytes[n])return;const b=VO.bytes[n];delete VO.bytes[n];ac.decodeAudioData(b).then(d=>{VO.buf[n]=d}).catch(()=>{})}
function voDecode(){Object.keys(VO.bytes).forEach(voOne);VO.ready=new Promise(res=>{const t=Date.now(),go=()=>{if((VO.map&&VO.buf[VO.map['Проведите пальцем по темноте']])||Date.now()-t>1500)res();else setTimeout(go,100)};go()})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let voQ=Promise.resolve();
function hush(){VO.gen=(VO.gen||0)+1;if(VO.cur){try{VO.cur.stop()}catch(_){}VO.cur=null}voQ=Promise.resolve()}
/* Реплики идут строго по очереди: новая ждёт, пока рассказчик договорит предыдущую */
function speak(text){const key=text.replace(/\*/g,'').trim(),d=on&&VO.map&&VO.buf[VO.map[key]];if(!d)return null;const gen=VO.gen;
  voQ=voQ.then(async()=>{if(!on||gen!==VO.gen)return;const n=ac.createBufferSource();n.buffer=d;n.connect(ac.destination);n.start();VO.cur=n;await sleep(d.duration*1000+280);VO.cur=null});return voQ}

  const d=[[33.4,30.2,'Понедельник. Музей был *закрыт*.'],[66.7,30.2,'Пропажу заметили через *26 часов*.'],[66.7,53.65,'Картина *77 на 53 см*. Унести можно под мышкой.'],[33.4,53.65,'Её держали только *четыре крюка*.']];

/* Лампа: водите пальцем, найденное отзывается само */
function lampBox(img){hotEl.hidden=false;hotEl.innerHTML='';const b=el('div','lamp',`<img class="dk" src="img/${img}.jpg" alt=""><img class="lit" src="img/${img}.jpg" alt=""><div class="glow"></div>`);hotEl.append(b);
  /* Пока палец не коснулся, свет бродит сам и показывает, что делать */
  const r=app.getBoundingClientRect();let t=0,idle=RM?0:setInterval(()=>{t+=.035;b.style.setProperty('--x',r.width*(.5+.3*Math.sin(t*1.3))+'px');b.style.setProperty('--y',r.height*(.5+.2*Math.sin(t*2.1))+'px')},40);
  return {b,stop(){clearInterval(idle)}}}
const lightAt=(e,r)=>[e.clientX-r.left,e.clientY-r.top+(e.pointerType==='touch'?-74:0)];
function roomLamp(){const l=lampBox('room');let done;const moved=new Promise(r=>done=r);l.b.addEventListener('pointermove',e=>{l.stop();const r=app.getBoundingClientRect(),[x,y]=lightAt(e,r);l.b.style.setProperty('--x',x+'px');l.b.style.setProperty('--y',y+'px');done()});return {moved,stop:l.stop}}
function lamp(img,task,targets){return new Promise(res=>{const l=lampBox(img),b=l.b;let armed=false,found=performance.now();
  /* Искать можно только когда рассказчик договорил */
  voQ.then(()=>{const v=note(task);(v||Promise.resolve()).then(()=>{armed=true;found=performance.now()})});
  const left=targets.map(t=>({...t,xy:map(t.x,t.y),t0:0}));let done=0;
  const ping=t=>{const p=el('i','ping');p.style.left=t.xy[0]+'px';p.style.top=t.xy[1]+'px';b.append(p);setTimeout(()=>p.remove(),850)};
  const help=setInterval(()=>{if(armed&&performance.now()-found>11000){const t=left.find(x=>!x.ok);if(t)ping(t)}},2400);
  b.addEventListener('pointermove',e=>{if(!armed)return;l.stop();const r=app.getBoundingClientRect(),[x,y]=lightAt(e,r);b.style.setProperty('--x',x+'px');b.style.setProperty('--y',y+'px');
    const now=performance.now();left.forEach(t=>{if(t.ok||!armed)return;const near=Math.hypot(x-t.xy[0],y-t.xy[1])<62;if(!near){t.t0=0;return}if(!t.t0)t.t0=now;if(now-t.t0>260){t.ok=1;done++;armed=false;ping(t);fx('step');buzz(30);
      const v=note(t.say);(v||sleep(900)).then(()=>{armed=true;found=performance.now();if(done===left.length){clearInterval(help);l.stop();sleep(500).then(res)}})}})});
})}

/* Стирание: палец снимает верхний слой */
function scrub(under,top,task,o={}){return new Promise(res=>{hotEl.hidden=false;hotEl.innerHTML='';
  const box=el('div','scrub',`<img src="img/${under}.jpg" alt="">`),c=document.createElement('canvas'),r=app.getBoundingClientRect();c.width=r.width;c.height=r.height;box.append(c);hotEl.append(box);let armed=false;voQ.then(()=>{const v=note(task);(v||Promise.resolve()).then(()=>armed=true)});
  const x=c.getContext('2d');
  if(top){const i=new Image();i.src=`img/${top}.jpg`;const paint=()=>{const s=Math.max(c.width/i.width,c.height/i.height);x.drawImage(i,(c.width-i.width*s)/2,(c.height-i.height*s)/2,i.width*s,i.height*s)};i.complete?paint():i.onload=paint}
  else{x.fillStyle='#120e10';x.fillRect(0,0,c.width,c.height)}
  x.globalCompositeOperation='destination-out';
  const G=14,seen=new Set(),need=(o.need||.5)*G*G*1.6,rad=o.rad||46;let sound=0,over=false;
  const brush=(px,py)=>{if(!armed)return;const g=x.createRadialGradient(px,py,4,px,py,rad);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.7,'rgba(0,0,0,.8)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rad,0,7);x.fill();
    for(let a=-1;a<=1;a++)for(let b2=-1;b2<=1;b2++)seen.add(Math.floor((px+a*rad*.7)/c.width*G)+':'+Math.floor((py+b2*rad*.7)/c.height*G*1.6));
    if(performance.now()-sound>120){sound=performance.now();fx(o.sound||'rub')}
    if(!over&&seen.size>=need){over=true;box.classList.add('done');buzz(40);setTimeout(res,750)}};
  box.addEventListener('pointermove',e=>{const q=app.getBoundingClientRect();brush(e.clientX-q.left,e.clientY-q.top)});
  box.addEventListener('pointerdown',e=>{const q=app.getBoundingClientRect();brush(e.clientX-q.left,e.clientY-q.top)})})}

/* Звук синтезируется в браузере и включается с первым нажатием */
let ac=null,on=false,heartT=0;
function noise(sec){const b=ac.createBuffer(1,ac.sampleRate*sec,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ac.createBufferSource();n.buffer=b;return n}
function boom(f,v,len){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(38,t+len*.8);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+len+.02)}
function fx(k){if(!ac||!on)return;
  if(k==='thud')return boom(95,.5,.25);if(k==='tick')return boom(1500,.035,.03);if(k==='step')return boom(240,.06,.14);if(k==='foot'){boom(105,.3,.14);return fx('tap')}
  if(k==='creak'){const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(190,t);o.frequency.linearRampToValueAtTime(120,t+1.1);l.frequency.value=23;lg.gain.value=26;l.connect(lg).connect(o.frequency);f.type='bandpass';f.frequency.value=900;f.Q.value=3;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+1.2);o.connect(f).connect(g).connect(ac.destination);o.start(t);l.start(t);o.stop(t+1.25);l.stop(t+1.25);return}if(k==='heart'){boom(70,.42,.17);setTimeout(()=>on&&boom(62,.3,.17),190);return}
  const t=ac.currentTime,g=ac.createGain(),n=noise(1.3),f=ac.createBiquadFilter();f.type='bandpass';f.Q.value=.8;g.connect(ac.destination);
  const soft=k==='cloth'||k==='tap',d=k==='rub'||k==='cloth'?.14:k==='tap'?.05:k==='shutter'?.14:k==='spin'?.85:1;f.frequency.setValueAtTime(k==='cloth'?620:k==='tap'?2400:k==='rub'?1500:k==='shutter'?3200:300,t);f.frequency.exponentialRampToValueAtTime(k==='cloth'?280:k==='tap'?1400:k==='rub'?900:k==='shutter'?1800:1900,t+d*.6);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(soft?.08:k==='rub'?.05:k==='shutter'?.32:.13,t+d*.4);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f).connect(g);n.start(t);n.stop(t+d+.05)}
let drone=null;
function tension(v){if(!ac||!drone)return;const t=ac.currentTime;drone.g.gain.setTargetAtTime(v*.1,t,1.1);drone.f.frequency.setTargetAtTime(150+v*460,t,1.1)}
function chord(){if(!ac||!on)return;const t=ac.currentTime;[220,277.2,329.6,440].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+1.4+i*.2);g.gain.exponentialRampToValueAtTime(.0001,t+6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+6.1)})}
function heart(go){clearInterval(heartT);if(go){fx('heart');heartT=setInterval(()=>fx('heart'),1050)}}
function soundOn(){try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();voDecode();const n=noise(4);n.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=260;const g=ac.createGain();g.gain.value=.05;n.connect(f).connect(g).connect(ac.destination);n.start();
    const dg=ac.createGain(),df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=200;dg.gain.value=0;[55,55.7,82.6].forEach(h=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=h;o.connect(df);o.start()});df.connect(dg).connect(ac.destination);drone={g:dg,f:df}}on=true;ac.resume();const b=$('snd');b.classList.add('on');b.setAttribute('aria-pressed','true')}catch(_){}}
$('snd').onclick=e=>{const b=e.currentTarget;if(!ac)return soundOn();on=!on;if(!on)hush();b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);on?ac.resume():ac.suspend()};
